# CI do lib-kore-design (ADR "GitHub Actions para CI-CD", decisão 145): roda em todo
# push, em qualquer branch; o PR mostra o resultado do último push.
name: CI

# Actions fixadas pelo SHA do commit (cadeia de fornecimento); a tag fica no comentário.

on:
  push:

permissions:
  contents: read

# Um push novo cancela o anterior na mesma branch, menos em homolog e production.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/homolog' && github.ref != 'refs/heads/production' }}

jobs:
  commitlint:
    name: Commits (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  check:
    name: Formatação, lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A versão do pnpm vem do packageManager do package.json; a do Node, do .nvmrc.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Publicação no GitHub Packages, só com o CI verde e só em homolog e production
  # (decisão 145; a regra de versão está em scripts/release.ts).
  publish:
    name: Publica o @kore-io/design
    needs: [commitlint, check]
    if: github.ref == 'refs/heads/homolog' || github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@kore-io'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec tsx scripts/publish.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
